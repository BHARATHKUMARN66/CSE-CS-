name: TryHackMe Progress

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  collect-progress:
    name: Collect TryHackMe Progress
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4

      # Downloads the Chromium binary itself AND the OS-level
      # libraries it needs (fonts, libnss3, etc.) that aren't
      # present on a stock ubuntu-latest runner. Without
      # --with-deps, the browser launch step in the script will
      # fail with a missing shared library error.
      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      # ------------------------------------------------------
      # Run collector
      # ------------------------------------------------------

      - name: Collect TryHackMe progress
        run: |
          python .github/scripts/collect_progress.py

      # ------------------------------------------------------
      # Show generated JSON
      # ------------------------------------------------------

      - name: Display collected data
        run: |
          echo "===== 2024-2028 ====="
          cat data/2024_2028_tryhackme.json || true

      # ------------------------------------------------------
      # Commit changes
      # ------------------------------------------------------

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # NOTE: these paths must exactly match the "markdown"
          # values in BATCHES inside collect_progress.py. Add
          # "2023 - 2027.md" back here (and un-comment its
          # entry in BATCHES) only once that batch is active
          # again, or this step will fail trying to add a file
          # that doesn't exist.
          git add \
            "2024-2028.md" \
            data/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update TryHackMe progress"
            git push
          fi